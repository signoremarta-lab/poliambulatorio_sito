<!DOCTYPE html>

<html lang="it" class="css-newsletter-status">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >


  <title>
    Conferma iscrizione | Poliambulatorio De Vitis
  </title>

  <link rel="stylesheet" href="style.css">
</head>


<body>


  <main>


    <section
      class="card"
      aria-live="polite"
    >


      <div
        class="icon"
        id="statusIcon"
        aria-hidden="true"
      >

        …

      </div>


      <h1
        id="statusTitle"
      >

        Conferma in corso...

      </h1>


      <p
        id="statusMessage"
      >

        Stiamo verificando la tua iscrizione.

      </p>


      <div
        class="loader"
        id="loader"
        aria-hidden="true"
      ></div>


      <a
        href="/index.html"
        class="home-link"
        id="homeLink"
        hidden
      >

        Torna al sito

      </a>


    </section>


  </main>



  <footer
    class="legal-footer"
  >

    © 2026 Poliambulatorio De Vitis

    ·

    <a
      href="/privacy-policy.html"
    >
      Privacy Policy
    </a>

    ·

    <a
      href="/cookie-policy.html"
    >
      Cookie Policy
    </a>

  </footer>



  <script>


  /* =======================================================
     CONFIGURAZIONE
     ======================================================= */

  const APPS_SCRIPT_URL =

    "https://script.google.com/macros/s/AKfycbxqGK99Ns9e2EjOwh5d7qVnQplO9iL9NSz9K1AFBmY2zsu3UF-p9ajbPROoWFRXvx4l-Q/exec";



  const titleElement =

    document.getElementById(
      "statusTitle"
    );


  const messageElement =

    document.getElementById(
      "statusMessage"
    );


  const iconElement =

    document.getElementById(
      "statusIcon"
    );


  const loaderElement =

    document.getElementById(
      "loader"
    );


  const homeLink =

    document.getElementById(
      "homeLink"
    );



  /* =======================================================
     TOKEN DALL'URL
     ======================================================= */

  const params =

    new URLSearchParams(
      window.location.search
    );


  const token =

    params.get(
      "token"
    );



  /* =======================================================
     CALLBACK JSONP
     ======================================================= */

  window.newsletterConfirmationCallback =

    function(result) {


      /*
       * La risposta è arrivata:
       * possiamo eliminare il loader.
       */

      loaderElement.style.display =
        "none";


      homeLink.hidden =
        false;



      if (
        result &&
        result.success
      ) {


        iconElement.textContent =
          "✓";


        titleElement.textContent =

          result.title ||

          "Iscrizione confermata";


        messageElement.textContent =

          result.message ||

          "La tua iscrizione è stata confermata.";


        return;

      }



      /*
       * Risposta negativa.
       */

      iconElement.textContent =
        "!";


      titleElement.textContent =

        result &&
        result.title

          ? result.title

          : "Impossibile confermare";


      messageElement.textContent =

        result &&
        result.message

          ? result.message

          : "Non è stato possibile confermare l'iscrizione.";

    };



  /* =======================================================
     AVVIO
     ======================================================= */

  function startConfirmation() {


    if (
      !token
    ) {


      showLocalError(

        "Collegamento non valido",

        "Il link di conferma è incompleto: manca il token di iscrizione."

      );


      return;

    }



    if (
      !APPS_SCRIPT_URL ||
      APPS_SCRIPT_URL.includes(
        "INCOLLA_QUI"
      )
    ) {


      showLocalError(

        "Configurazione incompleta",

        "Il servizio di conferma non è ancora configurato correttamente."

      );


      return;

    }



    /*
     * Creiamo uno script esterno.
     *
     * Questa è una richiesta JSONP:
     * non apre Apps Script come pagina e
     * non richiede fetch/CORS.
     */

    const script =

      document.createElement(
        "script"
      );



    const callbackName =

      "newsletterConfirmationCallback";



    script.src =

      APPS_SCRIPT_URL

      + "?action=confirm"

      + "&token="

      + encodeURIComponent(
          token
        )

      + "&callback="

      + encodeURIComponent(
          callbackName
        )

      + "&_="

      + Date.now();



    script.async =
      true;



    /*
     * Se Apps Script è irraggiungibile.
     */

    script.onerror =

      function() {


        showLocalError(

          "Errore di connessione",

          "Non è stato possibile verificare l'iscrizione. Riprova tra qualche minuto."

        );

      };



    document.body.appendChild(
      script
    );



    /*
     * Timeout di sicurezza:
     * 15 secondi.
     */

    setTimeout(
      function() {


        if (
          loaderElement.style.display !==
          "none"
        ) {


          showLocalError(

            "Tempo scaduto",

            "La verifica sta impiegando troppo tempo. Ricarica la pagina e riprova."

          );

        }


      },
      15000
    );

  }



  /* =======================================================
     ERRORE LOCALE
     ======================================================= */

  function showLocalError(
    title,
    message
  ) {


    loaderElement.style.display =
      "none";


    iconElement.textContent =
      "!";


    titleElement.textContent =
      title;


    messageElement.textContent =
      message;


    homeLink.hidden =
      false;

  }



  startConfirmation();


  </script>


</body>

</html>
